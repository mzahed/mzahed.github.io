<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Tesla sign-in code</title>
<style>body{font-family:system-ui;max-width:640px;margin:40px auto;padding:0 16px}code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px;font-size:15px}button{margin-top:10px;padding:8px 14px}</style></head>
<body><h2>Tesla sign-in finished</h2><p id="msg">Copy the code below and paste it back to Grok Bot. It expires in a few minutes.</p>
<code id="code"></code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy</button>
<p style="color:#666;font-size:13px">Nothing is sent anywhere by this page; it only reads the address bar.</p>
<script>var p=new URLSearchParams(location.search);var c=p.get('code'),e=p.get('error');
if(e){document.getElementById('msg').textContent='Tesla returned an error: '+e+' '+(p.get('error_description')||'');}
document.getElementById('code').textContent=c?('code='+c+'  state='+(p.get('state')||'')):'(no code in URL)';</script></body></html>
